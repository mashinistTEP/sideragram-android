name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK / NDK / CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Keystore
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" > /tmp/ks.b64
          echo "длина base64-секрета: $(wc -c < /tmp/ks.b64)"
          base64 -d /tmp/ks.b64 > TMessagesProj/config/release.keystore
          echo "размер keystore: $(wc -c < TMessagesProj/config/release.keystore) байт"
          if test ! -s TMessagesProj/config/release.keystore; then
            echo "::error::KEYSTORE_BASE64 пустой — секрет не задан или загрузился битым"
            exit 1
          fi
          if "$JAVA_HOME/bin/keytool" -list -keystore TMessagesProj/config/release.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}" >/dev/null 2>&1; then
            echo "ключ читается паролем: ок"
          else
            echo "::error::keystore есть, но не читается — проверь KEYSTORE_PASSWORD и KEY_ALIAS"
            exit 1
          fi
      - name: Build APK
        run: |
          ./gradlew :TMessagesProj_App:assembleAfatRelease -PRELEASE_STORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" -PRELEASE_KEY_ALIAS="${{ secrets.KEY_ALIAS }}" -PRELEASE_KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}" --no-daemon --stacktrace
      - name: Rename APK
        id: apk
        run: |
          SRC=$(find TMessagesProj_App/build/outputs/apk/afat/release -name "*.apk" 2>/dev/null | head -n1)
          if test -z "$SRC"; then SRC=$(find TMessagesProj_App/build/outputs/apk -name "*afat*release*.apk" 2>/dev/null | head -n1); fi
          if test -z "$SRC"; then SRC=$(find TMessagesProj_App/build/outputs/apk -name "*release*.apk" 2>/dev/null | head -n1); fi
          OUT="sideragram-${{ github.run_number }}.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
